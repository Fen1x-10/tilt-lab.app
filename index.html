<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Tilt Lab</title>
  <style>
    body { max-width: 380px; margin: 0 auto; padding: 16px; }
    h1 { margin-bottom: 4px; }
    button {
      background: #4ade80; color: #111; border: none; border-radius: 8px;
      padding: 10px 14px; margin: 4px; font-size: 15px; font-weight: bold; cursor: pointer;
    }
    #sellBtn { background: #f87171; }
    button:disabled, #sellBtn:disabled { background: #444; color: #888; cursor: not-allowed; }
    input {
      width: 80px; padding: 6px; border-radius: 6px; border: 1px solid #444;
      background: #1b1b1b; color: white; text-align: center; font-size: 16px;
    }
    canvas { max-width: 100%; }
        html, body, button, input { touch-action: manipulation; }
        @keyframes tilt {
      0%, 100% { transform: translateX(0); background: #111; }
      20% { transform: translateX(-8px); background: #3a1414; }
      40% { transform: translateX(8px); background: #3a1414; }
      60% { transform: translateX(-6px); background: #2a1010; }
      80% { transform: translateX(6px); background: #2a1010; }
    }
    .tilt { animation: tilt 0.4s; }
  </style>
</head>
<body style="background:#111; color:white; font-family:sans-serif; text-align:center;">

  <h1>Tilt Lab</h1>
  <p>Депозит: <span id="balance">1000</span> $</p>
  <p>Цена актива: <span id="price">100.0</span></p>
  <canvas id="chart" width="320" height="160" style="background:#1b1b1b; border-radius:8px;"></canvas>
  <p id="summary" style="font-weight:bold;"></p>
  <p id="review" style="color:tomato;"></p>
  <p>Размер сделки: <input id="amount" type="number" value="100"> $</p>
  <p>Стоп-лосс: <input id="stop" type="number" value="2"> %</p>
  <p>Сделок осталось: <span id="tradesLeft">10</span></p>
  <p>Нарушений правил: <span id="violations">0</span></p>
  <p>Лучшая оценка дисциплины: <span id="best">0</span></p>
  <button id="buyBtn" onclick="trade('buy')">Купить (жду роста)</button>
  <button id="sellBtn" onclick="trade('sell')">Продать (жду падения)</button>
  <button onclick="restart()">Начать заново</button>
  <p id="message" style="color:tomato;"></p>
  <p id="result"></p>
  <p id="achievement" style="color:gold;"></p>
  <p id="achievement2" style="color:gold;"></p>
  <p id="achievement3" style="color:gold;"></p>
  <p id="achievement4" style="color:gold;"></p>

  <script>
    let balance = 1000;
    let price = 100;
    let prices = [100];
    let violations = 0;
    let tradesLeft = 10;
    let lastProfit = 0;
    let lastAmount = 0;
    let trend = 0;
    let noStopCount = 0;
    let bigTradeCount = 0;
    let revengeCount = 0;
    let sessionStart = Date.now();
    let best = Number(localStorage.getItem("best")) || 0;
    document.getElementById("best").textContent = best;

    function drawChart() {
      let canvas = document.getElementById("chart");
      let ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (prices.length < 2) {
        return;
      }

      let min = Math.min(...prices);
      let max = Math.max(...prices);
      if (max === min) {
        max = min + 1;
      }

      ctx.beginPath();
      for (let i = 0; i < prices.length; i++) {
        let x = 10 + i * (canvas.width - 20) / (prices.length - 1);
        let y = canvas.height - 10 - (prices[i] - min) / (max - min) * (canvas.height - 20);
        if (i === 0) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      }
      ctx.strokeStyle = "#4ade80";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    function endSession() {
      document.getElementById("buyBtn").disabled = true;
      document.getElementById("sellBtn").disabled = true;

      let score = Math.max(0, 100 - violations * 25);
      if (score > best) {
        best = score;
        localStorage.setItem("best", best);
        document.getElementById("best").textContent = best;
      }

      let diff = balance - 1000;
      let text = "Сессия окончена. Итог: " + diff + " $. Оценка дисциплины: " + score + " из 100.";

      if (diff > 0 && violations > 0) {
        text = text + " Ты в плюсе, но с нарушениями правил: это удача, а не навык.";
      }
      document.getElementById("summary").textContent = text;

      if (violations > 0) {
        document.getElementById("review").innerHTML =
          "Разбор ошибок:<br>" +
          "Без стоп-лосса: " + noStopCount + "<br>" +
          "Сделка больше 20% депозита: " + bigTradeCount + "<br>" +
          "Реванш после убытка: " + revengeCount;
      }

      if (violations === 0) {
        document.getElementById("achievement3").textContent = "🏆 Ачивка: Хладнокровный (сессия без нарушений)";
      }

      let sessionDuration = (Date.now() - sessionStart) / 1000; // in seconds
      if (sessionDuration > 60) {
        document.getElementById("achievement4").textContent = "🏆 Ачивка: Мастер времени (сессия длиной более минуты)";
      }
    }

    function trade(direction) {
      let amount = Number(document.getElementById("amount").value);
      let stop = Number(document.getElementById("stop").value);

      if (amount <= 0) {
        document.getElementById("message").textContent = "Сумма должна быть больше нуля";
        return;
      }

      document.getElementById("message").textContent = "";

      if (amount > balance) {
        amount = balance;
      }

      let warnings = [];
            if (tradesLeft === 10 && Date.now() - sessionStart < 2000) {
        document.getElementById("achievement4").textContent = "🏆 Ачивка: Быстрейшая рука Дикого Запада (сделка за 2 секунды)";
      }

      if (stop <= 0) {
        noStopCount = noStopCount + 1;
        warnings.push("⚠ Нарушение: сделка без стоп-лосса!");
        document.getElementById("achievement2").textContent = "🏆 Ачивка: Стоп? Не слышал!";
      }

      if (amount > balance * 0.2) {
        bigTradeCount = bigTradeCount + 1;
        warnings.push("⚠ Нарушение: сделка больше 20% депозита!");
      }

      if (lastProfit < 0 && amount > lastAmount) {
        revengeCount = revengeCount + 1;
        warnings.push("⚠ Нарушение: увеличил сделку после убытка (реванш)!");
      }

      if (warnings.length > 0) {
        violations = violations + warnings.length;
        document.getElementById("violations").textContent = violations;
        document.getElementById("message").innerHTML = warnings.join("<br>");
                document.body.classList.add("tilt");
        setTimeout(function () { document.body.classList.remove("tilt"); }, 400);
      }

      trend = trend * 0.7 + (Math.random() * 2 - 1);
      let change = trend * 1.5 + (Math.random() * 2 - 1);

      let move = change;
      if (direction === "sell") {
        move = -change;
      }

      let stopped = false;
      if (stop > 0 && move < -stop) {
        move = -stop;
        stopped = true;
      }

      let profit = Math.round(amount * move / 100);

      price = price * (1 + change / 100);
      prices.push(price);
      if (prices.length > 20) {
        prices.shift();
      }

      balance = balance + profit;
      lastProfit = profit;
      lastAmount = amount;
      tradesLeft = tradesLeft - 1;

      document.getElementById("balance").textContent = balance;
      document.getElementById("price").textContent = price.toFixed(1);
      document.getElementById("tradesLeft").textContent = tradesLeft;

      let text = "Цена изменилась на " + change.toFixed(1) + "%. Результат: " + profit + " $";
      if (stopped) {
        text = text + " (сработал стоп-лосс)";
      }
      document.getElementById("result").textContent = text;
      drawChart();

      if (balance <= 0) {
        document.getElementById("achievement").textContent = "🏆 Ачивка: Слил всё!";
      }

      if (balance <= 0 || tradesLeft === 0) {
        endSession();
      }
    }

    function restart() {
      balance = 1000;
      price = 100;
      prices = [100];
      violations = 0;
      tradesLeft = 10;
      lastProfit = 0;
      lastAmount = 0;
      trend = 0;
      noStopCount = 0;
      bigTradeCount = 0;
      revengeCount = 0;
      document.getElementById("balance").textContent = balance;
      document.getElementById("price").textContent = "100.0";
      document.getElementById("tradesLeft").textContent = "10";
      document.getElementById("violations").textContent = "0";
      document.getElementById("result").textContent = "";
      document.getElementById("achievement").textContent = "";
      document.getElementById("achievement2").textContent = "";
      document.getElementById("achievement3").textContent = "";
      document.getElementById("achievement4").textContent = "";
      sessionStart = Date.now();
      document.getElementById("message").textContent = "";
      document.getElementById("summary").textContent = "";
      document.getElementById("review").innerHTML = "";
      document.getElementById("buyBtn").disabled = false;
      document.getElementById("sellBtn").disabled = false;
      drawChart();
    }
  </script>

</body>
</html>
